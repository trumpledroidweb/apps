<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>welcomeapp</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center relative overflow-hidden font-sans selection:bg-indigo-500 selection:text-white">
  <!-- Dynamic Background Glow Elements -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/25 rounded-full blur-3xl pointer-events-none animate-pulse-slow"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none animate-pulse-slower"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Interactive Canvas Sparkles -->
  <canvas id="ambientCanvas" class="absolute inset-0 pointer-events-none z-0"></canvas>

  <!-- Central Welcome Screen -->
  <main class="relative z-10 w-full max-w-lg mx-4 text-center">
    <div class="glass-card p-8 sm:p-12 rounded-3xl border border-white/10 shadow-2xl relative overflow-hidden backdrop-blur-xl transition-all duration-300 hover:border-white/20">
      
      <!-- Greeting Icon Badge -->
      <div class="inline-flex items-center justify-center mb-6 w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 shadow-lg shadow-indigo-500/30 text-white transform hover:scale-105 transition-transform duration-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>

      <!-- Live Dynamic Greeting Period -->
      <div class="inline-block px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase bg-white/5 border border-white/10 text-indigo-300 mb-3" id="greetingPill">
        Welcome
      </div>

      <!-- Main Welcome Title -->
      <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight mb-4 text-transparent bg-clip-text bg-gradient-to-r from-white via-indigo-100 to-purple-200">
        Welcome
      </h1>

      <!-- Welcome Subtitle -->
      <p id="welcomeMessage" class="text-slate-400 text-base sm:text-lg max-w-sm mx-auto leading-relaxed mb-8">
        We are thrilled to have you here. Step inside and make yourself at home.
      </p>

      <!-- Interactive Welcome Action -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
        <button id="welcomeBtn" class="w-full sm:w-auto px-8 py-3.5 rounded-xl font-semibold text-sm bg-gradient-to-r from-indigo-500 via-indigo-600 to-purple-600 text-white shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 cursor-pointer">
          Say Hello 👋
        </button>
      </div>

      <!-- Real-Time Clock Display -->
      <div class="mt-8 pt-6 border-t border-white/5 flex items-center justify-between text-xs text-slate-500">
        <span id="currentTime">--:-- --</span>
        <span class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
          Ready
        </span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
